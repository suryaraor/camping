<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏕️ Camping Planner</title>

  <!-- React + Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    /* ── Reset & base ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:   #2d6a4f;
      --green2:  #40916c;
      --green3:  #74c69d;
      --amber:   #f4a261;
      --red:     #e76f51;
      --sky:     #219ebc;
      --bg:      #f0f4f1;
      --card:    #ffffff;
      --text:    #1b2826;
      --muted:   #6b7c74;
      --border:  #d8e4dc;
      --radius:  12px;
      --shadow:  0 2px 12px rgba(0,0,0,.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .app-header {
      background: var(--green);
      color: #fff;
      padding: 16px 20px 0;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .app-header h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 14px; }
    .nav-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tab {
      padding: 8px 16px;
      border-radius: 8px 8px 0 0;
      background: transparent;
      color: rgba(255,255,255,.75);
      border: none; cursor: pointer;
      font-size: .875rem; font-weight: 500;
      white-space: nowrap; transition: all .15s;
    }
    .nav-tab.active { background: var(--bg); color: var(--green); font-weight: 700; }
    .nav-tab:hover:not(.active) { background: rgba(255,255,255,.12); color: #fff; }

    /* ── Layout ──────────────────────────────────────────────────── */
    .page { padding: 20px; max-width: 900px; margin: 0 auto; }

    /* ── Cards ───────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--text); }

    /* ── Summary stats ───────────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card {
      background: var(--card); border-radius: var(--radius);
      padding: 16px; text-align: center; box-shadow: var(--shadow);
    }
    .stat-value { font-size: 1.8rem; font-weight: 800; color: var(--green); }
    .stat-label { font-size: .78rem; color: var(--muted); margin-top: 4px; }

    /* ── Day cards ───────────────────────────────────────────────── */
    .day-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
    .day-label { background: var(--green); color: #fff; padding: 10px 16px; font-weight: 700; font-size: .9rem; }
    .meal-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-bottom: 1px solid var(--border); transition: background .1s;
    }
    .meal-row:last-child { border-bottom: none; }
    .meal-row:hover { background: #f7faf8; }
    .meal-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .meal-info { flex: 1; }
    .meal-name { font-weight: 600; font-size: .9rem; }
    .meal-detail { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .meal-badge { font-size: .7rem; padding: 3px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }

    /* ── Shopping ────────────────────────────────────────────────── */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--card); font-size: .8rem; cursor: pointer; font-weight: 500; transition: all .15s;
    }
    .filter-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    .shopping-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: var(--card); border-radius: var(--radius);
      margin-bottom: 8px; box-shadow: var(--shadow); transition: opacity .2s;
    }
    .shopping-item.purchased { opacity: .55; }
    .check-btn {
      width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--border);
      background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s;
    }
    .check-btn.checked { background: var(--green3); border-color: var(--green); }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; font-size: .9rem; }
    .item-meta { font-size: .75rem; color: var(--muted); margin-top: 3px; }
    .item-store { font-size: .75rem; font-weight: 600; color: var(--sky); }

    /* ── Shop tile grid ─────────────────────────────────────────────── */
    .store-section { margin-bottom: 24px; }
    .store-section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .store-section-name { font-size: 1rem; font-weight: 700; color: var(--text); }
    .store-progress {
      font-size: .75rem; color: var(--muted);
      background: var(--border); padding: 2px 9px; border-radius: 20px;
    }
    .store-all-done {
      font-size: .75rem; font-weight: 700; color: var(--green);
      background: #dcfce7; padding: 3px 10px; border-radius: 20px;
    }
    .item-tiles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 500px) { .item-tiles-grid { grid-template-columns: repeat(2, 1fr); } }
    .item-tile {
      position: relative; background: var(--card); border: 2px solid var(--border);
      border-radius: var(--radius); padding: 14px 10px; text-align: center;
      cursor: pointer; transition: all .15s; box-shadow: var(--shadow);
      min-height: 90px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      -webkit-tap-highlight-color: transparent; user-select: none;
      width: 100%; outline: none;
    }
    .item-tile:hover { border-color: var(--green3); background: #f5fff8; }
    .item-tile:active { transform: scale(.93); }
    .item-tile--done { background: #f0fdf4; border-color: var(--green); opacity: .72; }
    .item-tile-check {
      position: absolute; top: 5px; right: 8px;
      font-size: .95rem; font-weight: 900; color: var(--green);
    }
    .item-tile-name {
      font-weight: 700; font-size: .82rem; color: var(--text);
      line-height: 1.25; word-break: break-word;
    }
    .item-tile--done .item-tile-name { text-decoration: line-through; color: var(--muted); }
    .item-tile-qty { font-size: .72rem; color: var(--muted); }
    .item-tile-meal { font-size: .68rem; color: var(--muted); margin-top: 1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .item-tile-spinner {
      position: absolute; top: 5px; right: 8px;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.12);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .65s linear infinite;
    }
    .item-tile--loading { opacity: .7; cursor: wait; }

    /* ── Expenses ────────────────────────────────────────────────── */
    .expense-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .expense-table th { text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); color: var(--muted); font-weight: 600; }
    .expense-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .expense-table tr:last-child td { border-bottom: none; }
    .expense-table tr:hover td { background: #f7faf8; }
    .store-tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .72rem; font-weight: 700; background: #e0f2fe; color: #0369a1; }
    .progress-bar-wrap { background: var(--border); border-radius: 99px; height: 8px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--green); border-radius: 99px; transition: width .4s; }

    /* ── Family split ────────────────────────────────────────────── */
    .family-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .family-row:last-child { border-bottom: none; }
    .family-avatar { width: 40px; height: 40px; border-radius: 10px; background: var(--green3); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
    .family-cost { font-size: 1rem; font-weight: 800; color: var(--green); margin-left: auto; }

    /* ── Signups ─────────────────────────────────────────────────── */
    .signup-card {
      display: flex; align-items: center; gap: 12px; background: var(--card);
      border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); margin-bottom: 10px;
    }
    .signup-avatar {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, var(--green2), var(--green3));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 1rem; flex-shrink: 0;
    }

    /* ── Form ────────────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
    .form-input, .form-select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: .9rem; background: var(--card); transition: border-color .15s; outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--green2); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn { padding: 10px 20px; border-radius: 8px; border: none; font-size: .875rem; font-weight: 600; cursor: pointer; transition: all .15s; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green2); }
    .btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text); }
    .btn-outline:hover { border-color: var(--green2); color: var(--green); }
    .btn-sm { padding: 6px 12px; font-size: .78rem; }

    /* ── Modal ───────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center; z-index: 200;
    }
    @media (min-width: 640px) { .modal-overlay { align-items: center; } }
    .modal {
      background: var(--card); border-radius: 20px 20px 0 0;
      padding: 24px 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
    }
    @media (min-width: 640px) { .modal { border-radius: var(--radius); } }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    /* ── Misc ────────────────────────────────────────────────────── */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .section-title { font-size: 1.1rem; font-weight: 700; }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-amber { background: #fef3c7; color: #d97706; }
    .badge-gray  { background: #f3f4f6; color: #6b7280; }
    .text-muted  { color: var(--muted); font-size: .85rem; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 10px; }
    .config-banner {
      background: #fef3c7; border: 1px solid #fbbf24; border-radius: var(--radius);
      padding: 12px 16px; margin-bottom: 20px; font-size: .85rem; display: flex; gap: 10px; align-items: flex-start;
    }
    .config-banner code { background: rgba(0,0,0,.08); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: .82rem; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } .stats-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// After deploying apps-script/Code.gs, paste your Web App URL here
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwfV3pGKVADORaaN4tH0Pz6arQPt_d_iK_2ZINPtidn27xHAh5oJXugo48q5MDGZkhpCQ/exec';
// Set to false once your Apps Script is deployed and URL is set above
const USE_MOCK_DATA = false;

// ─── MOCK DATA ────────────────────────────────────────────────────────────────
const MOCK = {
  schedule: [
    { _row:2,  Day:1, Meal:'Breakfast', Item:'Pancakes & Bacon',      Details:'Cast iron skillet',              'Assigned Volunteer':'Priya',  Status:'Planned' },
    { _row:3,  Day:1, Meal:'Lunch',     Item:'Sandwiches & Chips',    Details:'Make-your-own station',           'Assigned Volunteer':'Ravi',   Status:'Planned' },
    { _row:4,  Day:1, Meal:'Dinner',    Item:'BBQ Burgers & Dogs',    Details:'Grill by the fire pit',          'Assigned Volunteer':'Surya',  Status:'Planned' },
    { _row:5,  Day:1, Meal:'Activity',  Item:'Nature Hike',           Details:'3-mile loop, meet at 10am',      'Assigned Volunteer':'Anand',  Status:'Planned' },
    { _row:6,  Day:2, Meal:'Breakfast', Item:'Eggs & Toast',          Details:'Full camp breakfast',            'Assigned Volunteer':'Priya',  Status:'Planned' },
    { _row:7,  Day:2, Meal:'Lunch',     Item:'Taco Bar',              Details:'Carne asada + veggie option',    'Assigned Volunteer':'Meera',  Status:'Planned' },
    { _row:8,  Day:2, Meal:'Dinner',    Item:'Campfire Stew',         Details:'Big pot — veg & beef',           'Assigned Volunteer':'Surya',  Status:'Planned' },
    { _row:9,  Day:2, Meal:'Activity',  Item:'Kayaking',              Details:'Rent from park office at 2pm',   'Assigned Volunteer':'Ravi',   Status:'Planned' },
    { _row:10, Day:3, Meal:'Breakfast', Item:'Cereal & Fruit',        Details:'Easy pack-up morning',           'Assigned Volunteer':'All',    Status:'Planned' },
    { _row:11, Day:3, Meal:'Activity',  Item:'Depart & Clean Up',     Details:'Check-out by noon',              'Assigned Volunteer':'All',    Status:'Planned' },
  ],
  shopping: [
    { _row:2,  ID:'s1',  Meal:'Breakfast', Category:'Groceries', Item:'Eggs',          Quantity:'3 dozen', Store:'Costco',      Volunteer:'Priya',  Status:'Purchased', Cost:8.99  },
    { _row:3,  ID:'s2',  Meal:'Breakfast', Category:'Groceries', Item:'Pancake Mix',   Quantity:'2 bags',  Store:'Trader Joes', Volunteer:'Priya',  Status:'Purchased', Cost:6.50  },
    { _row:4,  ID:'s3',  Meal:'Breakfast', Category:'Groceries', Item:'Bacon',         Quantity:'3 packs', Store:'Costco',      Volunteer:'Ravi',   Status:'Pending',   Cost:0     },
    { _row:5,  ID:'s4',  Meal:'Lunch',     Category:'Groceries', Item:'Bread Loaves',  Quantity:'4',       Store:'Safeway',     Volunteer:'Ravi',   Status:'Pending',   Cost:0     },
    { _row:6,  ID:'s5',  Meal:'Dinner',    Category:'Groceries', Item:'Burger Patties',Quantity:'40',      Store:'Costco',      Volunteer:'Surya',  Status:'Pending',   Cost:0     },
    { _row:7,  ID:'s6',  Meal:'Dinner',    Category:'Groceries', Item:'Hot Dogs',      Quantity:'2 packs', Store:'Costco',      Volunteer:'Surya',  Status:'Pending',   Cost:0     },
    { _row:8,  ID:'s7',  Meal:'Supplies',  Category:'Supplies',  Item:'Paper Plates',  Quantity:'100 ct',  Store:'Target',      Volunteer:'Meera',  Status:'Pending',   Cost:0     },
    { _row:9,  ID:'s8',  Meal:'Supplies',  Category:'Supplies',  Item:'Charcoal Bags', Quantity:'3',       Store:'Target',      Volunteer:'Meera',  Status:'Purchased', Cost:24.00 },
    { _row:10, ID:'s9',  Meal:'Dinner',    Category:'Groceries', Item:'Burger Buns',   Quantity:'3 packs', Store:'Safeway',     Volunteer:'Anand',  Status:'Pending',   Cost:0     },
    { _row:11, ID:'s10', Meal:'Lunch',     Category:'Groceries', Item:'Deli Meats',    Quantity:'3 lbs',   Store:'Safeway',     Volunteer:'Anand',  Status:'Pending',   Cost:0     },
  ],
  volunteers: [
    { _row:2, Name:'Priya', Family:'Sharma', 'Assigned Store':'Costco',      Phone:'555-0101' },
    { _row:3, Name:'Ravi',  Family:'Sharma', 'Assigned Store':'Trader Joes', Phone:'555-0102' },
    { _row:4, Name:'Surya', Family:'Rao',    'Assigned Store':'Costco',      Phone:'555-0103' },
    { _row:5, Name:'Meera', Family:'Patel',  'Assigned Store':'Target',      Phone:'555-0104' },
    { _row:6, Name:'Anand', Family:'Patel',  'Assigned Store':'Safeway',     Phone:'555-0105' },
  ],
  families: [
    { _row:2, 'Family Name':'Sharma', Members:6, Contact:'Priya', Email:'priya@example.com' },
    { _row:3, 'Family Name':'Rao',    Members:4, Contact:'Surya', Email:'surya@example.com' },
    { _row:4, 'Family Name':'Patel',  Members:5, Contact:'Meera', Email:'meera@example.com' },
    { _row:5, 'Family Name':'Kumar',  Members:3, Contact:'Amit',  Email:'amit@example.com'  },
  ],
  expenses: [
    { _row:2, Volunteer:'Priya', Store:'Costco',      Item:'Eggs, Pancake Mix', Amount:15.49, Date:'2024-07-10' },
    { _row:3, Volunteer:'Meera', Store:'Target',      Item:'Charcoal Bags',     Amount:24.00, Date:'2024-07-10' },
    { _row:4, Volunteer:'Surya', Store:'Costco',      Item:'Water Cases x4',    Amount:18.00, Date:'2024-07-11' },
    { _row:5, Volunteer:'Ravi',  Store:'Trader Joes', Item:'Snacks & Chips',    Amount:32.50, Date:'2024-07-11' },
  ],
  signups: [
    { _row:2, Name:'Priya Sharma', Family:'Sharma', Members:6, Email:'priya@example.com', 'Dietary Notes':'None',           'Signed Up At':'2024-06-20' },
    { _row:3, Name:'Surya Rao',    Family:'Rao',    Members:4, Email:'surya@example.com', 'Dietary Notes':'Vegetarian x2',  'Signed Up At':'2024-06-21' },
    { _row:4, Name:'Meera Patel',  Family:'Patel',  Members:5, Email:'meera@example.com', 'Dietary Notes':'Nut allergy x1', 'Signed Up At':'2024-06-22' },
    { _row:5, Name:'Amit Kumar',   Family:'Kumar',  Members:3, Email:'amit@example.com',  'Dietary Notes':'None',           'Signed Up At':'2024-06-23' },
  ],
};

// ─── LOCAL MOCK STATE (so toggles/adds work in demo) ─────────────────────────
const mockState = { ...JSON.parse(JSON.stringify(MOCK)) };

function computeSummary(data) {
  const totalCost    = data.expenses.reduce((s,e) => s + (parseFloat(e.Amount)||0), 0);
  const totalPeople  = data.signups.reduce((s,p)  => s + (parseInt(p.Members)||0),  0);
  const costPerPerson = totalPeople > 0 ? totalCost / totalPeople : 0;
  const byStore = {};
  data.expenses.forEach(e => { byStore[e.Store] = (byStore[e.Store]||0) + (parseFloat(e.Amount)||0); });
  const familyCosts  = data.families.map(f => ({
    family:  f['Family Name'], members: parseInt(f.Members)||0,
    cost:    Math.round((parseInt(f.Members)||0) * costPerPerson * 100) / 100,
  }));
  const totalItems    = data.shopping.length;
  const purchasedItems = data.shopping.filter(i => i.Status === 'Purchased').length;
  return {
    totalCost:       Math.round(totalCost*100)/100,
    totalPeople,
    costPerPerson:   Math.round(costPerPerson*100)/100,
    byStore,
    familyCosts,
    shoppingProgress: { total: totalItems, purchased: purchasedItems },
  };
}

// ─── API CLIENT ───────────────────────────────────────────────────────────────
const api = {
  async get(action) {
    if (USE_MOCK_DATA) {
      await new Promise(r => setTimeout(r, 280));
      const map = { getSchedule:'schedule', getShopping:'shopping', getVolunteers:'volunteers',
                    getFamilies:'families', getExpenses:'expenses', getSignups:'signups' };
      if (action === 'getSummary') return computeSummary(mockState);
      return JSON.parse(JSON.stringify(mockState[map[action]] || []));
    }
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=${action}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    return json.data;
  },
  async post(body) {
    if (USE_MOCK_DATA) {
      await new Promise(r => setTimeout(r, 180));
      return { ok: true };
    }
    const res  = await fetch(APPS_SCRIPT_URL, { method:'POST', body: JSON.stringify(body) });
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    return json.data;
  },
};

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const MEAL_ICONS   = { Breakfast:'🌅', Lunch:'☀️', Dinner:'🔥', Activity:'🎒', Supplies:'🧰' };
const MEAL_COLORS  = { Breakfast:'#fef9c3', Lunch:'#dcfce7', Dinner:'#fee2e2', Activity:'#dbeafe', Supplies:'#f3e8ff' };

// ─── HOOKS ────────────────────────────────────────────────────────────────────
function useData(action) {
  const [data, setData]       = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError]     = React.useState(null);
  const load = React.useCallback(async () => {
    setLoading(true); setError(null);
    try   { setData(await api.get(action)); }
    catch (e) { setError(e.message); }
    finally   { setLoading(false); }
  }, [action]);
  React.useEffect(() => { load(); }, [load]);
  return { data, loading, error, reload: load, setData };
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function Modal({ title, onClose, children }) {
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>

// ─── SCHEDULE ─────────────────────────────────────────────────────────────────
function ScheduleView() {
  const { data, loading, reload } = useData('getSchedule');
  const [showAdd, setShowAdd] = React.useState(false);
  const [form, setForm] = React.useState({ Day:1, Meal:'Breakfast', Item:'', Details:'', 'Assigned Volunteer':'', Status:'Planned' });

  const grouped = React.useMemo(() => {
    if (!data) return {};
    const byDay = {};
    data.forEach(row => {
      const d = row.Day != null && row.Day !== '' ? `Day ${row.Day}` : 'General';
      if (!byDay[d]) byDay[d] = {};
      const meal = row.Meal;
      if (!byDay[d][meal]) byDay[d][meal] = [];
      byDay[d][meal].push(row);
    });
    const sorted = Object.fromEntries(
      Object.entries(byDay).sort(([a], [b]) => {
        if (a === 'General') return 1;
        if (b === 'General') return -1;
        return parseInt(a.replace('Day ', '')) - parseInt(b.replace('Day ', ''));
      })
    );
    return sorted;
  }, [data]);

  const handleAdd = async () => {
    if (!form.Item.trim()) return;
    if (USE_MOCK_DATA) {
      mockState.schedule.push({ ...form, _row: mockState.schedule.length + 2 });
    }
    await api.post({ action:'addScheduleItem', data: form });
    setShowAdd(false);
    reload();
  };

  if (loading) return <div className="empty-state"><div className="emoji">⏳</div><p>Loading schedule…</p></div>;

  return (
    <div>
      <div className="section-header">
        <div className="section-title">📅 Trip Schedule</div>
        <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>+ Add Item</button>
      </div>

      {Object.entries(grouped).map(([day, mealTypes]) => (
        <div key={day} className="day-card">
          <div className="day-label">{day}</div>
          {Object.entries(mealTypes).map(([mealType, items]) => {
            const byVolunteer = {};
            items.forEach(item => {
              const v = item['Assigned Volunteer'] || 'Unassigned';
              if (!byVolunteer[v]) byVolunteer[v] = [];
              byVolunteer[v].push(item.Item);
            });
            const content = Object.entries(byVolunteer)
              .map(([v, its]) => `${v} (${its.join(', ')})`)
              .join(', ');
            return (
              <div key={mealType} className="meal-row">
                <div className="meal-icon" style={{background: MEAL_COLORS[mealType] || '#f3f4f6'}}>
                  {MEAL_ICONS[mealType] || '📌'}
                </div>
                <div className="meal-info">
                  <div className="meal-name">{mealType}</div>
                  <div className="meal-detail">{content}</div>
                </div>
              </div>
            );
          })}
        </div>
      ))}

      {showAdd && (
        <Modal title="➕ Add Schedule Item" onClose={() => setShowAdd(false)}>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Day #</label>
              <input className="form-input" type="number" min="1" value={form.Day}
                onChange={e => setForm({...form, Day: e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Type</label>
              <select className="form-select" value={form.Meal} onChange={e => setForm({...form, Meal:e.target.value})}>
                <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Activity</option>
              </select>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Item / Name *</label>
            <input className="form-input" placeholder="e.g. Pancakes & Bacon" value={form.Item}
              onChange={e => setForm({...form, Item:e.target.value})} />
          </div>
          <div className="form-group">
            <label className="form-label">Details</label>
            <input className="form-input" placeholder="Notes, location, time…" value={form.Details}
              onChange={e => setForm({...form, Details:e.target.value})} />
          </div>
          <div className="form-group">
            <label className="form-label">Assigned Volunteer</label>
            <input className="form-input" placeholder="Name" value={form['Assigned Volunteer']}
              onChange={e => setForm({...form, 'Assigned Volunteer':e.target.value})} />
          </div>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setShowAdd(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleAdd}>Add to Schedule</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── SHOPPING ─────────────────────────────────────────────────────────────────
function ShoppingView() {
  const { data, loading, reload, setData } = useData('getShopping');
  const [showAdd, setShowAdd] = React.useState(false);
  const [pendingRow, setPendingRow] = React.useState(null);
  const [form, setForm] = React.useState({ Meal:'Breakfast', Category:'Groceries', Item:'', Quantity:'', Store:'', Volunteer:'', Status:'Pending', Cost:0 });

  // Group items by store
  const byStore = React.useMemo(() => {
    if (!data) return {};
    return data.reduce((acc, item) => {
      const store = item.Store || 'Other';
      if (!acc[store]) acc[store] = [];
      acc[store].push(item);
      return acc;
    }, {});
  }, [data]);

  const toggleStatus = async (item) => {
    if (pendingRow !== null) return;
    setPendingRow(item._row);
    try {
      const newStatus = item.Status === 'Purchased' ? 'Pending' : 'Purchased';
      if (USE_MOCK_DATA) {
        const idx = mockState.shopping.findIndex(i => i._row === item._row);
        if (idx !== -1) mockState.shopping[idx].Status = newStatus;
      }
      await api.post({ action:'updateStatus', id:item.ID, row:item._row, status:newStatus });
      setData(prev => prev.map(i => i._row === item._row ? {...i, Status:newStatus} : i));
    } finally {
      setPendingRow(null);
    }
  };

  const handleAdd = async () => {
    if (!form.Item.trim()) return;
    const newItem = { ...form, ID:'s'+ Date.now(), _row: (data?.length||0)+2 };
    if (USE_MOCK_DATA) mockState.shopping.push(newItem);
    await api.post({ action:'addShoppingItem', data: newItem });
    setShowAdd(false);
    reload();
  };

  const purchased = data ? data.filter(i => i.Status==='Purchased').length : 0;
  const total     = data ? data.length : 0;

  if (loading) return <div className="empty-state"><div className="emoji">⏳</div><p>Loading shopping list…</p></div>;

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">🛒 Shopping List</div>
          <div className="text-muted" style={{marginTop:4}}>{purchased} of {total} items done</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>+ Add Item</button>
      </div>

      {/* Overall progress bar */}
      <div className="card" style={{padding:'12px 16px',marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,fontSize:'.82rem',color:'var(--muted)'}}>
          <span>Overall Progress</span>
          <span>{total > 0 ? Math.round(purchased/total*100) : 0}%</span>
        </div>
        <div className="progress-bar-wrap">
          <div className="progress-bar" style={{width: total>0 ? `${purchased/total*100}%` : '0%'}} />
        </div>
      </div>

      {/* One section per store */}
      {Object.entries(byStore).map(([store, items]) => {
        const storeDone = items.filter(i => i.Status==='Purchased').length;
        const allDone   = storeDone === items.length;
        return (
          <div key={store} className="store-section">
            <div className="store-section-header">
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span className="store-section-name">🏪 {store}</span>
                <span className="store-progress">{storeDone}/{items.length} done</span>
              </div>
              {allDone && <span className="store-all-done">✓ All Done!</span>}
            </div>

            <div className="item-tiles-grid">
              {items.map(item => {
                const isLoading = pendingRow === item._row;
                return (
                  <button
                    key={item._row}
                    className={`item-tile${item.Status==='Purchased' ? ' item-tile--done' : ''}${isLoading ? ' item-tile--loading' : ''}`}
                    onClick={() => toggleStatus(item)}
                    disabled={pendingRow !== null}
                  >
                    {isLoading
                      ? <div className="item-tile-spinner" />
                      : item.Status==='Purchased' && <div className="item-tile-check">✓</div>
                    }
                    <div className="item-tile-name">{item.Item}</div>
                    <div className="item-tile-qty">{item.Quantity}</div>
                    <div className="item-tile-meal">{MEAL_ICONS[item.Meal] || '🍽️'} {item.Meal}</div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}

      {showAdd && (
        <Modal title="➕ Add Shopping Item" onClose={() => setShowAdd(false)}>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Meal</label>
              <select className="form-select" value={form.Meal} onChange={e => setForm({...form,Meal:e.target.value})}>
                <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Supplies</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Category</label>
              <select className="form-select" value={form.Category} onChange={e => setForm({...form,Category:e.target.value})}>
                <option>Groceries</option><option>Produce</option><option>Dairy</option><option>Supplies</option>
              </select>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Item Name *</label>
            <input className="form-input" placeholder="e.g. Eggs" value={form.Item} onChange={e => setForm({...form,Item:e.target.value})} />
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Quantity</label>
              <input className="form-input" placeholder="e.g. 2 dozen" value={form.Quantity} onChange={e => setForm({...form,Quantity:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Store</label>
              <input className="form-input" placeholder="e.g. Costco" value={form.Store} onChange={e => setForm({...form,Store:e.target.value})} />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Assigned Volunteer</label>
            <input className="form-input" placeholder="Name" value={form.Volunteer} onChange={e => setForm({...form,Volunteer:e.target.value})} />
          </div>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setShowAdd(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleAdd}>Add Item</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

                  <div key={j} style={{display:'flex',alignItems:'center',gap:8,padding:'4px 0',fontSize:'.82rem'}}>
                    <span>{item.Status==='Purchased'?'✅':'⬜'}</span>
                    <span style={{flex:1,textDecoration:item.Status==='Purchased'?'line-through':'none',color:item.Status==='Purchased'?'var(--muted)':'var(--text)'}}>
                      {item.Item}
                    </span>
                    <span style={{color:'var(--muted)',fontSize:'.72rem'}}>{item.Quantity}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
const TABS = [
  { id:'schedule',   label:'📅 Schedule'  },
  { id:'shopping',   label:'🛒 Shopping'  },
  { id:'expenses',   label:'💰 Expenses'  },
  { id:'signups',    label:'📝 Signups'   },
  { id:'volunteers', label:'🙋 Volunteers'},
];

function App() {
  const [tab, setTab] = React.useState('schedule');
  return (
    <div>
      <div className="app-header">
        <h1>🏕️ Camping Planner</h1>
        <div className="nav-tabs">
          {TABS.map(t => (
            <button key={t.id}
              className={`nav-tab ${tab===t.id?'active':''}`}
              onClick={() => setTab(t.id)}>
              {t.label}
            </button>
          ))}
        </div>
      </div>
      <div className="page">
        {USE_MOCK_DATA && (
          <div className="config-banner">
            <span>⚠️</span>
            <div>
              <strong>Demo Mode</strong> — using sample data.
              To connect live Google Sheets: deploy <code>apps-script/Code.gs</code> as a Web App,
              paste the URL into <code>APPS_SCRIPT_URL</code> at the top of this file,
              then set <code>USE_MOCK_DATA = false</code>.
            </div>
          </div>
        )}
        {tab === 'schedule'   && <ScheduleView />}
        {tab === 'shopping'   && <ShoppingView />}
        {tab === 'expenses'   && <ExpensesView />}
        {tab === 'signups'    && <SignupsView />}
        {tab === 'volunteers' && <VolunteersView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
